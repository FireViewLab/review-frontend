<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="리뷰를 믿고, 현명하게 쇼핑하다.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Re:view">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- CJK fallback fonts for Japanese and Chinese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 렌더링을 막지 않도록 print 미디어로 받은 뒤 적용한다 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <title>Re:view</title>
  <link rel="manifest" href="manifest.json">

  <!-- Flutter 첫 프레임 전까지 보여 줄 로딩 화면 -->
  <style>
    html, body { margin: 0; height: 100%; background: #F8FAFC; }
    #app-loading {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      transition: opacity 200ms ease-out;
      pointer-events: none;
    }
    #app-loading.is-hidden { opacity: 0; }
    #app-loading .retry { display: none; pointer-events: auto; font-size: 14px; color: #6B7280; }
    #app-loading .retry a { color: #2563EB; }
    #app-loading.is-slow .retry { display: block; }
    #app-loading .wordmark { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; color: #111827; }
    #app-loading .wordmark span { color: #2563EB; }
    #app-loading .bar { width: 120px; height: 3px; border-radius: 3px; background: #E5E7EB; overflow: hidden; }
    #app-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #2563EB;
      animation: app-loading-slide 1.1s ease-in-out infinite;
    }
    @keyframes app-loading-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #app-loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="app-loading" role="progressbar" aria-label="Re:view 불러오는 중">
    <div class="wordmark">Re<span>:</span>view</div>
    <div class="bar"></div>
    <p class="retry">불러오는 데 시간이 걸리고 있어요. <a href="" onclick="location.reload(); return false;">새로고침</a></p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('app-loading');
      // 로딩이 15초를 넘기면 새로고침 안내를 보여 준다.
      var slowTimer = setTimeout(function () { el.classList.add('is-slow'); }, 15000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slowTimer);
        el.classList.add('is-hidden');
        setTimeout(function () { el.remove(); }, 250);
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 해시 URL(#/product/1)로 저장된 기존 링크를 경로 URL로 옮긴다.
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', location.hash.slice(1));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
