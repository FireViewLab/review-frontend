name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Copy Vercel config to build output
        run: |
          cat > build/web/vercel.json << 'EOF'
          {
            "headers": [
              {
                "source": "/assets/assets/:path*",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=86400, stale-while-revalidate=604800" }
                ]
              }
            ],
            "rewrites": [
              { "source": "/api/:path*", "destination": "https://api.re-view.kr/api/:path*" },
              { "source": "/oauth2/:path*", "destination": "https://api.re-view.kr/oauth2/:path*" },
              { "source": "/login/oauth2/:path*", "destination": "https://api.re-view.kr/login/oauth2/:path*" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Preview to Vercel
        run: vercel deploy build/web --token=${{ secrets.VERCEL_TOKEN }} --yes

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Copy Vercel config to build output
        run: |
          cat > build/web/vercel.json << 'EOF'
          {
            "headers": [
              {
                "source": "/assets/assets/:path*",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=86400, stale-while-revalidate=604800" }
                ]
              }
            ],
            "rewrites": [
              { "source": "/api/:path*", "destination": "https://api.re-view.kr/api/:path*" },
              { "source": "/oauth2/:path*", "destination": "https://api.re-view.kr/oauth2/:path*" },
              { "source": "/login/oauth2/:path*", "destination": "https://api.re-view.kr/login/oauth2/:path*" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Production to Vercel
        run: vercel deploy build/web --prod --token=${{ secrets.VERCEL_TOKEN }} --yes